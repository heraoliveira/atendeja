server:
  port: ${API_PORT:8080}

spring:
  application:
    name: atendeja-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:atendeja}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:atendeja_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:change_me}}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

atendeja:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:PT8H}
  auth:
    demo-users:
      enabled: ${DEMO_AUTH_USERS_ENABLED:false}
      admin-email: ${DEMO_ADMIN_EMAIL:admin@atendeja.local}
      admin-password: ${DEMO_ADMIN_PASSWORD:}
      attendant-email: ${DEMO_ATTENDANT_EMAIL:attendant@atendeja.local}
      attendant-password: ${DEMO_ATTENDANT_PASSWORD:}
